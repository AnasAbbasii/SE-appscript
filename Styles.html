<style>
*{box-sizing:border-box}body{font:13px/1.4 "Segoe UI",Roboto,Arial,sans-serif;color:#1d2733;margin:0;padding:14px;background:#fff}
h3{margin:0 0 10px;color:#1F3A5F;font-size:16px}label{display:block;font-weight:600;margin:9px 0 3px;font-size:12px;color:#34495e}
input,select,textarea{width:100%;padding:7px 8px;border:1px solid #c5ced8;border-radius:5px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid #9db8dd;border-color:#1F3A5F}input:disabled{background:#eef1f4}
textarea{resize:vertical;min-height:44px}.row{display:flex;gap:10px}.row>div{flex:1}
.chk{display:flex;align-items:center;gap:8px;margin:4px 0;padding:8px;background:#f2f6fb;border-radius:5px}.chk input{width:auto}.chk label{margin:0}
button{padding:8px 14px;border:0;border-radius:5px;background:#1F3A5F;color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:#e4e9f0;color:#1F3A5F}button:disabled{opacity:.55;cursor:default}.bar{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.msg{margin-top:10px;padding:8px 10px;border-radius:5px;display:none;white-space:pre-wrap}.ok{background:#e6f4ea;color:#1e6b34;display:block}.err{background:#fce8e6;color:#a1271b;display:block}
.warn{background:#fef7e0;color:#7a5b00;padding:8px 10px;border-radius:5px;margin-top:10px}.hide{display:none}
table{width:100%;border-collapse:collapse;margin-top:8px}th,td{padding:5px 6px;border-bottom:1px solid #e3e8ef;text-align:left;font-size:12px}th{background:#f2f6fb}
.pill{padding:1px 7px;border-radius:9px;font-size:11px;background:#e4e9f0}.small{font-size:11px;color:#667}
</style>
